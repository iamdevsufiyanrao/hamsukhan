# Shopify app config for the Hamsukhan voice assistant.
# Run `shopify app config link` once to fill in client_id from your Partner dashboard. No secrets live in this file:
# the client secret goes into Hamsukhan → Super admin → Settings → Plugins → Shopify app.
client_id = "REPLACE_WITH_YOUR_SHOPIFY_CLIENT_ID"
name = "Hamsukhan voice assistant"
application_url = "https://hamsukhan.techvocalz.com/shopify/install"
embedded = false

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
# Only to add the call button to the storefront (ScriptTag). No orders, customers or products are read.
scopes = "write_script_tags"

[auth]
redirect_urls = ["https://hamsukhan.techvocalz.com/integrations/shopify/callback"]

[webhooks]
api_version = "2025-07"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://hamsukhan.techvocalz.com/api/shopify/webhooks"
  customer_data_request_url = "https://hamsukhan.techvocalz.com/api/shopify/webhooks"
  shop_deletion_url = "https://hamsukhan.techvocalz.com/api/shopify/webhooks"

[pos]
embedded = false
